<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confetti — Seguí tu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFBF3;
    --paper-dim:#FFF4DE;
    --ink:#1F2A44;
    --ink-soft:#5B6478;
    --rojo:#E8483C;
    --violeta:#6E4E9E;
    --verde:#1E9C7C;
    --naranja:#F5941F;
    --azul:#1B4A9C;
    --linea: rgba(31,42,68,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{ font-family:'Baloo 2', sans-serif; margin:0; }
  .wrap{ max-width:620px; margin:0 auto; padding:0 24px; }

  header{
    padding:22px 0;
    border-bottom:1px solid var(--linea);
    margin-bottom:44px;
  }
  header a{ text-decoration:none; color:var(--ink); font-family:'Baloo 2', sans-serif; font-size:1.3rem; }

  .buscador h1{ font-size:1.6rem; margin-bottom:8px; }
  .buscador p{ color:var(--ink-soft); margin-top:0; margin-bottom:20px; }
  .form-buscar{
    display:flex;
    gap:10px;
  }
  .form-buscar input{
    flex:1;
    padding:13px 16px;
    border-radius:12px;
    border:1px solid var(--linea);
    font-family:inherit;
    font-size:1rem;
    text-transform:uppercase;
  }
  .form-buscar button{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.98rem;
    padding:0 22px;
    border-radius:12px;
    border:none;
    background:var(--rojo);
    color:#fff;
    cursor:pointer;
  }
  .form-buscar button:hover{ background:#c73a2f; }

  .aviso-error{
    margin-top:18px;
    background:#FBEAE8;
    color:var(--rojo);
    border:1px solid #f3c9c4;
    border-radius:10px;
    padding:12px 16px;
    font-size:0.92rem;
  }

  .resultado{ margin-top:36px; display:none; }
  .resultado.visible{ display:block; }

  .cabecera-pedido{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:6px;
  }
  .cabecera-pedido .codigo{ font-size:1.3rem; }
  .cabecera-pedido .fecha{ color:var(--ink-soft); font-size:0.85rem; }

  .stepper{
    display:flex;
    justify-content:space-between;
    margin:28px 0 8px;
    position:relative;
  }
  .stepper::before{
    content:"";
    position:absolute;
    top:13px; left:0; right:0;
    height:3px;
    background:var(--linea);
    z-index:0;
  }
  .paso-step{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    flex:1;
  }
  .paso-step .circulo{
    width:28px; height:28px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--linea);
    display:flex; align-items:center; justify-content:center;
    font-size:0.8rem;
    font-weight:700;
    color:var(--ink-soft);
  }
  .paso-step.activo .circulo{ border-color:var(--verde); background:var(--verde); color:#fff; }
  .paso-step.actual .circulo{ border-color:var(--rojo); background:var(--rojo); color:#fff; }
  .paso-step .etiqueta{ font-size:0.78rem; text-align:center; color:var(--ink-soft); max-width:80px; }
  .paso-step.activo .etiqueta, .paso-step.actual .etiqueta{ color:var(--ink); font-weight:600; }

  .aviso-cancelado{
    margin-top:24px;
    background:#FBEAE8;
    border:1px solid #f3c9c4;
    border-radius:14px;
    padding:18px 20px;
    color:var(--rojo);
  }

  .aviso-vencimiento{
    margin-top:20px;
    background:var(--paper-dim);
    border-radius:12px;
    padding:12px 16px;
    font-size:0.88rem;
    color:var(--ink-soft);
  }

  .items{
    margin-top:28px;
    background:#fff;
    border:1px solid var(--linea);
    border-radius:14px;
    padding:18px 20px;
  }
  .items .fila{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:0.92rem;
  }
  .items .total{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    padding-top:10px;
    margin-top:6px;
    border-top:1px solid var(--linea);
  }

  .volver{
    display:inline-block;
    margin-top:28px;
    color:var(--ink-soft);
    font-size:0.9rem;
  }
</style>
</head>
<body>

<header>
  <div class="wrap"><a href="index.html">Confetti</a></div>
</header>

<div class="wrap">
  <div class="buscador">
    <h1>Seguí tu pedido</h1>
    <p>Ingresá el código que te dimos al confirmar (ej: CF-A1B2).</p>
    <div class="form-buscar">
      <input type="text" id="input-codigo" placeholder="CF-XXXX" maxlength="12">
      <button id="btn-buscar">Buscar</button>
    </div>
    <div class="aviso-error" id="aviso-error" style="display:none;"></div>
  </div>

  <div class="resultado" id="resultado"></div>

  <a class="volver" href="index.html">← Volver al catálogo</a>
</div>

<script>
  const API = 'api/';

  const ETAPAS = [
    { clave: 'pendiente',      etiqueta: 'Pendiente' },
    { clave: 'en_preparacion', etiqueta: 'En preparación' },
    { clave: 'listo',          etiqueta: 'Listo para retirar' },
    { clave: 'entregado',      etiqueta: 'Entregado' },
  ];

  const formatoPrecio = new Intl.NumberFormat('es-AR', {
    style: 'currency', currency: 'ARS', maximumFractionDigits: 0,
  });

  function etiquetaCantidad(item) {
    if (item.tipo_venta === 'peso') {
      const kg = parseFloat(item.cantidad);
      return kg < 1 ? `${Math.round(kg * 1000)}g` : `${kg}kg`;
    }
    return `x${parseInt(item.cantidad, 10)}`;
  }

  function formatoFecha(iso) {
    const d = new Date(iso.replace(' ', 'T'));
    return d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  async function buscarPedido(codigo) {
    const avisoError = document.getElementById('aviso-error');
    const resultado = document.getElementById('resultado');
    avisoError.style.display = 'none';
    resultado.classList.remove('visible');

    try {
      const res = await fetch(API + 'seguimiento.php?codigo=' + encodeURIComponent(codigo));
      const data = await res.json();

      if (!res.ok) {
        avisoError.textContent = data.error || 'No se pudo buscar el pedido.';
        avisoError.style.display = 'block';
        return;
      }

      renderResultado(data);
    } catch (err) {
      avisoError.textContent = 'No se pudo conectar. Probá de nuevo en un momento.';
      avisoError.style.display = 'block';
    }
  }

  function renderResultado(pedido) {
    const cont = document.getElementById('resultado');

    let html = `
      <div class="cabecera-pedido">
        <span class="codigo"><strong>${pedido.codigo}</strong></span>
        <span class="fecha">Pedido a las ${formatoFecha(pedido.creado_en)}</span>
      </div>
    `;

    if (pedido.estado === 'cancelado') {
      html += `
        <div class="aviso-cancelado">
          Este pedido fue cancelado. Si te parece raro, escribinos y lo revisamos.
        </div>
      `;
    } else {
      const indiceActual = ETAPAS.findIndex(e => e.clave === pedido.estado);
      html += '<div class="stepper">';
      ETAPAS.forEach((etapa, i) => {
        let clase = '';
        if (i < indiceActual) clase = 'activo';
        if (i === indiceActual) clase = 'actual';
        html += `
          <div class="paso-step ${clase}">
            <div class="circulo">${i < indiceActual ? '✓' : i + 1}</div>
            <div class="etiqueta">${etapa.etiqueta}</div>
          </div>
        `;
      });
      html += '</div>';

      if (pedido.vence_en && ['pendiente', 'en_preparacion', 'listo'].includes(pedido.estado)) {
        html += `<div class="aviso-vencimiento">Tenés hasta las ${formatoFecha(pedido.vence_en)} para retirarlo.</div>`;
      }
    }

    html += '<div class="items">';
    pedido.items.forEach(item => {
      html += `
        <div class="fila">
          <span>${item.nombre_item} (${etiquetaCantidad(item)})</span>
          <span>${formatoPrecio.format(item.subtotal)}</span>
        </div>
      `;
    });
    html += `
        <div class="total"><span>Total</span><span>${formatoPrecio.format(pedido.total)}</span></div>
      </div>
    `;

    cont.innerHTML = html;
    cont.classList.add('visible');
  }

  document.getElementById('btn-buscar').addEventListener('click', () => {
    const codigo = document.getElementById('input-codigo').value.trim();
    if (codigo) buscarPedido(codigo);
  });

  document.getElementById('input-codigo').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-buscar').click();
  });

  // Si llegan con ?codigo=CF-XXXX en la URL (ej: desde la confirmación del pedido),
  // buscamos automáticamente.
  const params = new URLSearchParams(window.location.search);
  const codigoUrl = params.get('codigo');
  if (codigoUrl) {
    document.getElementById('input-codigo').value = codigoUrl;
    buscarPedido(codigoUrl);
  }
</script>

</body>
</html>
